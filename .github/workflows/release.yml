name: release

# Push a tag like v0.2.0 to publish a signed APK as a GitHub release.
# A pull request that changes the release setup builds and verifies the APK without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "app/build.gradle.kts"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          REM_KEYSTORE_BASE64: ${{ secrets.REM_KEYSTORE_BASE64 }}
        run: echo "$REM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rem-release.jks"

      - name: Test and build
        env:
          REM_KEYSTORE_PATH: ${{ runner.temp }}/rem-release.jks
          REM_KEYSTORE_PASSWORD: ${{ secrets.REM_KEYSTORE_PASSWORD }}
          REM_KEY_ALIAS: ${{ secrets.REM_KEY_ALIAS }}
          REM_KEY_PASSWORD: ${{ secrets.REM_KEY_PASSWORD }}
        run: >
          ./gradlew :core:test :app:testDebugUnitTest :app:assembleRelease --stacktrace
          -Prem.versionName="${GITHUB_REF_NAME#v}"
          -Prem.versionCode="${{ github.run_number }}"

      - name: Verify signature
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "rem-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "rem-$GITHUB_REF_NAME.apk" --generate-notes
